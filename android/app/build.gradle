plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.4"

android {
    namespace = "com.fastflow.vpn"
    compileSdk = 34
    // Must match the NDK used to cross-compile libvpn_engine.so (see Makefile).
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.fastflow.vpn"
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // Ship only the ABIs we build the engine for; keeps the APK lean.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // libvpn_engine.so is picked up automatically from src/main/jniLibs/<abi>/.
    // Do not compress it so it can be mmap'd/dlopen'd directly on install.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    // Pin to the locally installed NDK so the first native build doesn't
    // stall on AGP's default-NDK auto-download. r28+ also emits 16 KB
    // page-aligned .so files by default.
    ndkVersion "29.0.14206865"

    // C++ JNI shim (libfastflow_jni.so): forwards ConnectivityManager network
    // state from Kotlin into the Go engine and Go "protect" requests back up.
    // The C ABI shared with the engine lives in data/vpn_engine/netif_bridge.h.
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
        }
    }

    buildTypes {
        release {
            // TODO: replace with a real release signing config before publishing.
            signingConfig = signingConfigs.debug
            // Only applied when minification is enabled; keeps the JNI seam
            // (NativeBridge) from being renamed or stripped by R8.
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

flutter {
    // Path to the Flutter project root (contains pubspec.yaml). Two levels up
    // from android/app.
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "androidx.core:core-ktx:1.13.1"
}
