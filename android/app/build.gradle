plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

android {
    namespace = "com.fastflow.vpn"
    compileSdk = 34
    // Must match the NDK used to cross-compile libvpn_engine.so (see Makefile).
    ndkVersion = "26.1.10909125"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.fastflow.vpn"
        minSdk = 24
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName

        // Ship only the ABIs we build the engine for; keeps the APK lean.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // libvpn_engine.so is picked up automatically from src/main/jniLibs/<abi>/.
    // Do not compress it so it can be mmap'd/dlopen'd directly on install.
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    buildTypes {
        release {
            // TODO: replace with a real release signing config before publishing.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    // Path to the Flutter project root (contains pubspec.yaml). Two levels up
    // from android/app.
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib"
    implementation "androidx.core:core-ktx:1.13.1"
}
