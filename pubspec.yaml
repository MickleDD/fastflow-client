name: fastflow_vpn
description: >-
  Modern, high-performance VPN client (VLESS / Reality / Hysteria2) for Android
  and Windows, driving a Go sing-box core over Dart FFI.
publish_to: none
# Must track the GitHub Release tags (tag "v1.0.1" <-> version 1.0.1+N): the
# in-app updater compares this semver against the latest release tag.
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Internationalization (l10n): en / ru / es
  flutter_localizations:
    sdk: flutter
  # `any` lets the Flutter SDK pin the exact intl version it ships with, which
  # avoids version conflicts with flutter_localizations.
  intl: any

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage (native on Android, FFI on Windows/desktop)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3

  # Paths + FFI
  path: ^1.9.0
  path_provider: ^2.1.4
  ffi: ^2.1.3

  # In-app update check (GitHub Releases)
  http: ^1.2.2
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Generate AppLocalizations from lib/l10n/*.arb (configured in l10n.yaml).
  generate: true
